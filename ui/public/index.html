<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Company Knowledge Assistant</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Company Knowledge Assistant home">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span>Company <strong>Knowledge</strong></span>
      </a>
      <span class="status"><i></i> Knowledge base</span>
    </header>

    <section class="conversation" aria-label="Chat conversation">
      <div class="welcome" id="welcome">
        <div class="welcome-icon" aria-hidden="true">✳</div>
        <p class="eyebrow">YOUR WORKPLACE, EXPLAINED</p>
        <h1>What would you like to know?</h1>
        <p class="intro">Ask a question about company policies and get a clear answer from your knowledge base.</p>
        <button class="suggestion" type="button">How many annual leave days do employees receive?<span>↗</span></button>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
    </section>

    <form class="composer" id="chat-form">
      <label class="sr-only" for="question">Ask a question</label>
      <textarea id="question" rows="1" maxlength="2000" placeholder="Ask anything about your company…" required></textarea>
      <div class="composer-bottom">
        <span>Answers are based on your company documents</span>
        <button class="send" id="send" type="submit" aria-label="Send question">↑</button>
      </div>
    </form>
    <footer>Company Knowledge Assistant <span>·</span> Ask a question to get started</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
